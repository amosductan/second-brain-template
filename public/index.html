<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0f1115" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Second Brain</title>
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="icon" href="/icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/styles.css?v=1" />
</head>
<body>
  <header>
    <h1>Second Brain</h1>
    <span id="status-pill" class="pill"></span>
  </header>

  <form id="auth-form" hidden>
    <label>Access token <input id="auth-token" type="password" autocomplete="current-password" required /></label>
    <button class="btn primary" type="submit">Unlock</button>
    <span id="auth-message" role="status"></span>
  </form>

  <nav class="tabs">
    <button data-tab="capture" class="active">Capture</button>
    <button data-tab="notes">Notes</button>
    <button data-tab="tasks">Tasks</button>
    <button data-tab="chat">Chat</button>
  </nav>

  <main>
    <!-- CAPTURE -->
    <section id="tab-capture" class="tab active">
      <div class="record-area">
        <button id="record-btn" class="record-btn" aria-label="Record">
          <span class="mic" aria-hidden="true"><svg viewBox="0 0 24 24" width="34" height="34" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0"/><path d="M12 18v4"/></svg></span>
        </button>
        <div id="record-time" class="record-time">tap to record</div>
        <!-- Says whether the screen wake lock was actually granted. A refused
             lock (Low Power Mode) is exactly what makes a recording die when the
             screen blanks, so it must never be silent. -->
        <div id="record-hint" class="record-hint" hidden></div>
      </div>

      <div id="outbox-banner" class="outbox-banner" hidden></div>

      <div class="divider">or</div>

      <label class="upload-box">
        <input id="file-input" type="file" accept="audio/*,.m4a,.mp3,.wav,.webm,.ogg,.aac" multiple hidden />
        <span><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-4px;margin-right:7px" aria-hidden="true"><path d="M12 16V4"/><path d="m7 9 5-5 5 5"/><path d="M4 16v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/></svg>Upload voice memo(s)</span>
        <small>Apple Voice Memos, recordings of meetings or presentations, any length</small>
      </label>

      <div class="divider">or</div>

      <div class="paste-box">
        <textarea id="text-input" rows="4" placeholder="Paste a transcript or type a note…"></textarea>
        <button id="text-submit" class="btn primary">Save note</button>
      </div>

      <div id="capture-feed" class="capture-feed"></div>
    </section>

    <!-- NOTES -->
    <section id="tab-notes" class="tab">
      <div class="notes-toolbar">
        <input id="search-input" type="search" placeholder="Search everything you've said…" />
        <select id="category-filter"><option value="">All categories</option></select>
      </div>
      <div id="notes-list" class="notes-list"></div>
      <button id="notes-more" class="btn" hidden>Load more</button>
    </section>

    <!-- TASKS -->
    <section id="tab-tasks" class="tab">
      <div class="notes-toolbar">
        <select id="task-category"><option value="">All categories</option></select>
        <select id="task-state">
          <option value="open,working">Open</option>
          <option value="done,dropped">Closed</option>
          <option value="open,working,done,dropped">All</option>
        </select>
      </div>
      <div id="tasks-list" class="notes-list"></div>
    </section>

    <!-- CHAT -->
    <section id="tab-chat" class="tab">
      <div id="chat-thread" class="chat-thread">
        <div class="chat-msg assistant">Ask me anything about what you've recorded: ideas, meetings, plans, all of it.</div>
      </div>
      <form id="chat-form" class="chat-form">
        <input id="chat-input" type="text" placeholder="Talk to your second brain…" autocomplete="off" />
        <button type="submit" class="btn primary">Send</button>
      </form>
    </section>
  </main>

  <!-- Note detail modal -->
  <dialog id="note-modal">
    <div id="note-modal-body"></div>
    <div class="modal-actions">
      <button id="note-retry" class="btn">Retry processing</button>
      <button id="note-delete" class="btn danger">Delete</button>
      <button id="note-close" class="btn">Close</button>
    </div>
  </dialog>

  <script src="/app.js?v=1"></script>
</body>
</html>
